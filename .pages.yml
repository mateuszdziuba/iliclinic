# Pages CMS Configuration for Iliclinic
# Docs: https://pagescms.org/docs/configuration

media:
  input: public/images
  output: /images

content:
  # Partner brands/logos
  - name: marki
    label: Marki partnerskie
    type: collection
    path: src/content/marki
    format: yaml-frontmatter
    fields:
      - name: name
        label: Nazwa marki
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
      - name: url
        label: Link do strony
        type: string
      - name: order
        label: Kolejność
        type: number
        default: 0

  # Treatments collection (zabiegi)
  - name: zabiegi
    label: Zabiegi
    type: collection
    path: src/content/zabiegi
    format: yaml-frontmatter
    fields:
      - name: title
        label: Tytuł
        type: string
        required: true
      - name: description
        label: Krótki opis
        type: text
        required: true
      - name: locations
        label: Lokalizacje
        type: select
        options:
          multiple: true
          values:
            - value: pruszkow
              label: Pruszków
            - value: ostroleka
              label: Ostrołęka
        required: true
      - name: category
        label: Kategoria
        type: select
        options:
          creatable: true
          values:
            - Medycyna Estetyczna
            - Hi-Tech / Laser
            - Pielęgnacja Twarzy
            - Inne
      - name: price_pruszkow
        label: Cena w Pruszkowie (zł)
        type: number
      - name: price_ostroleka
        label: Cena w Ostrołęce (zł)
        type: number
      - name: duration
        label: Czas zabiegu
        type: string
      - name: featured
        label: Wyróżniony
        type: boolean
        default: false
      - name: image
        label: Zdjęcie
        type: image
      - name: wskazania
        label: Wskazania
        type: list
        item:
          type: string
      - name: przeciwwskazania
        label: Przeciwwskazania
        type: list
        item:
          type: string
      - name: przygotowanie_do_zabiegu
        label: Przygotowanie do zabiegu
        type: list
        item:
          type: string
      - name: seo
        label: SEO
        type: object
        fields:
          - name: metaTitle
            label: Meta Title
            type: string
          - name: metaDescription
            label: Meta Description
            type: text
      - name: body
        label: Treść
        type: rich-text

  # Static pages (strony)
  - name: strony
    label: Strony
    type: collection
    path: src/content/strony
    format: yaml-frontmatter
    fields:
      - name: title
        label: Tytuł
        type: string
        required: true
      - name: description
        label: Opis
        type: text
      - name: seo
        label: SEO
        type: object
        fields:
          - name: metaTitle
            label: Meta Title
            type: string
          - name: metaDescription
            label: Meta Description
            type: text
      - name: location
        label: Lokalizacja
        type: select
        options:
          values:
            - value: global
              label: Globalna (wszystkie)
            - value: pruszkow
              label: Pruszków
            - value: ostroleka
              label: Ostrołęka
      - name: body
        label: Treść
        type: rich-text

  - name: cenniki
    label: Cenniki
    type: collection
    path: src/content/cenniki
    format: yaml
    filename: "{fields.location}.yaml"
    view:
      primary: location
      fields: [location]
    fields:
      - name: location
        label: Lokalizacja
        type: select
        options:
          values:
            - value: pruszkow
              label: Pruszków
            - value: ostroleka
              label: Ostrołęka
        required: true
      - name: intro
        label: Tekst pod nagłówkiem
        type: text
      - name: emptyState
        label: Tekst gdy brak pozycji w cenniku
        type: text
      - name: consultationText
        label: Tekst sekcji kontaktowej
        type: text
      - name: primaryCtaLabel
        label: Etykieta głównego przycisku
        type: string
      - name: categories
        label: Kategorie
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{fields.name}"
        fields:
          - name: name
            label: Nazwa kategorii
            type: string
            required: true
          - name: services
            label: Usługi
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{fields.name}"
            fields:
              - name: name
                label: Nazwa usługi
                type: string
                required: true
              - name: duration
                label: Czas trwania (min)
                type: number
              - name: price
                label: Cena (zł)
                type: number

  # Site settings
  - name: settings
    label: Ustawienia strony
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: siteName
        label: Nazwa strony
        type: string
      - name: siteDescription
        label: Opis strony
        type: text
      - name: seo
        label: SEO
        type: object
        fields:
          - name: homeTitle
            label: Home Meta Title
            type: string
          - name: homeDescription
            label: Home Meta Description
            type: text
      - name: defaultLocation
        label: Domyślna lokalizacja
        type: select
        options:
          values:
            - value: pruszkow
              label: Pruszków
            - value: ostroleka
              label: Ostrołęka

  # Locations config
  - name: locations
    label: Lokalizacje
    type: file
    path: src/data/locations.json
    format: json
    fields:
      - name: pruszkow
        label: Pruszków
        type: object
        fields:
          - name: name
            label: Nazwa
            type: string
          - name: salonName
            label: Nazwa salonu
            type: string
          - name: seo
            label: SEO
            type: object
            fields:
              - name: homeTitle
                label: Home Meta Title
                type: string
              - name: homeDescription
                label: Home Meta Description
                type: text
              - name: treatmentsTitle
                label: Zabiegi Meta Title
                type: string
              - name: treatmentsDescription
                label: Zabiegi Meta Description
                type: text
              - name: contactTitle
                label: Kontakt Meta Title
                type: string
              - name: contactDescription
                label: Kontakt Meta Description
                type: text
              - name: aboutTitle
                label: O nas Meta Title
                type: string
              - name: aboutDescription
                label: O nas Meta Description
                type: text
              - name: pricingTitle
                label: Cennik Meta Title
                type: string
              - name: pricingDescription
                label: Cennik Meta Description
                type: text
          - name: slug
            label: Slug
            type: string
          - name: address
            label: Adres
            type: object
            fields:
              - name: street
                label: Ulica
                type: string
              - name: city
                label: Miasto
                type: string
              - name: postalCode
                label: Kod pocztowy
                type: string
          - name: phone
            label: Telefon
            type: string
          - name: email
            label: Email
            type: string
          - name: googleMapsUrl
            label: Link do Google Maps
            type: string
          - name: openingHours
            label: Godziny otwarcia
            type: object
            fields:
              - name: weekdays
                label: Pon-Pt
                type: string
              - name: saturday
                label: Sobota
                type: string
              - name: sunday
                label: Niedziela
                type: string
          - name: social
            label: Social Media
            type: object
            fields:
              - name: facebook
                label: Facebook
                type: string
              - name: instagram
                label: Instagram
                type: string
      - name: ostroleka
        label: Ostrołęka
        type: object
        fields:
          - name: name
            label: Nazwa
            type: string
          - name: salonName
            label: Nazwa salonu
            type: string
          - name: seo
            label: SEO
            type: object
            fields:
              - name: homeTitle
                label: Home Meta Title
                type: string
              - name: homeDescription
                label: Home Meta Description
                type: text
              - name: treatmentsTitle
                label: Zabiegi Meta Title
                type: string
              - name: treatmentsDescription
                label: Zabiegi Meta Description
                type: text
              - name: contactTitle
                label: Kontakt Meta Title
                type: string
              - name: contactDescription
                label: Kontakt Meta Description
                type: text
              - name: aboutTitle
                label: O nas Meta Title
                type: string
              - name: aboutDescription
                label: O nas Meta Description
                type: text
              - name: pricingTitle
                label: Cennik Meta Title
                type: string
              - name: pricingDescription
                label: Cennik Meta Description
                type: text
          - name: slug
            label: Slug
            type: string
          - name: address
            label: Adres
            type: object
            fields:
              - name: street
                label: Ulica
                type: string
              - name: city
                label: Miasto
                type: string
              - name: postalCode
                label: Kod pocztowy
                type: string
          - name: phone
            label: Telefon
            type: string
          - name: email
            label: Email
            type: string
          - name: googleMapsUrl
            label: Link do Google Maps
            type: string
          - name: openingHours
            label: Godziny otwarcia
            type: object
            fields:
              - name: weekdays
                label: Pon-Pt
                type: string
              - name: saturday
                label: Sobota
                type: string
              - name: sunday
                label: Niedziela
                type: string
          - name: social
            label: Social Media
            type: object
            fields:
              - name: facebook
                label: Facebook
                type: string
              - name: instagram
                label: Instagram
                type: string
